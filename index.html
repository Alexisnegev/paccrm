<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacCRM — IP5 Énergie</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F4F5F7;color:#172B4D;min-height:100vh}
:root{
  --bg:#F4F5F7;--s:#fff;--s2:#F4F5F7;--bd:#E2E8F0;--bd2:#CBD5E0;
  --blue:#0052CC;--bl:#DEEBFF;--green:#006644;--gl:#E3FCEF;
  --orange:#974F0C;--ol:#FFF0E6;--red:#BF2600;--rl:#FFEBE6;
  --purple:#403294;--pl:#EAE6FF;--teal:#006C72;--tl:#E6FCFF;
  --t:#172B4D;--t2:#5E6C84;--t3:#97A0AF;--r:4px;--r2:8px;
}

/* LOGIN */
.login-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#0052CC,#0747A6);display:flex;align-items:center;justify-content:center;z-index:999}
.login-card{background:#fff;border-radius:12px;padding:36px 40px;width:360px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-title{font-size:20px;font-weight:700;color:var(--t);text-align:center;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:10px}
.login-icon{width:36px;height:36px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.login-icon i{color:#fff;font-size:20px}
.login-sub{font-size:12px;color:var(--t3);text-align:center;margin-bottom:24px}
.login-lbl{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.login-inp{width:100%;padding:10px 14px;border:1px solid var(--bd2);border-radius:6px;font-size:14px;font-family:'Inter',sans-serif;outline:none;color:var(--t);margin-bottom:14px;transition:border-color .15s}
.login-inp:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,82,204,.15)}
.login-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.login-btn:hover{background:#0747A6}
.login-err{background:var(--rl);color:var(--red);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;border:1px solid #FFBDAD;display:none}
.login-err.show{display:block}

/* APP */
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:220px;min-width:220px;background:var(--s);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* SIDEBAR */
.logo{padding:16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px}
.logo-ic{width:32px;height:32px;border-radius:6px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-ic i{color:#fff;font-size:18px}
.logo-t{font-size:15px;font-weight:600;color:var(--t)}
.logo-s{font-size:10px;color:var(--t3)}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-s{font-size:10px;font-weight:600;color:var(--t3);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.5px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--t2);transition:all .12s;margin-bottom:1px;user-select:none}
.ni:hover{background:var(--bl);color:var(--blue)}
.ni.act{background:var(--bl);color:var(--blue);font-weight:500}
.ni i{font-size:16px;width:18px;text-align:center}
.nbadge{margin-left:auto;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--blue);color:#fff}
.nbadge.red{background:#DE350B}
.team-s{padding:10px 8px 14px;border-top:1px solid var(--bd)}
.team-lbl{font-size:10px;font-weight:600;color:var(--t3);margin-bottom:7px;padding:0 4px;text-transform:uppercase;letter-spacing:.5px}
.tm{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);cursor:pointer}
.tm:hover{background:var(--s2)}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.tm-n{font-size:12px;color:var(--t2);flex:1}
.tm-c{font-size:11px;color:var(--t3)}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--bd);background:var(--s);flex-shrink:0;gap:10px}
.ptitle{font-size:15px;font-weight:600;color:var(--t);white-space:nowrap}
.tbr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sbox{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:6px 11px;width:200px}
.sbox input{background:none;border:none;outline:none;color:var(--t);font-size:12px;font-family:'Inter',sans-serif;width:100%}
.sbox input::placeholder{color:var(--t3)}
.user-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r);background:var(--s2);border:1px solid var(--bd);font-size:12px;color:var(--t2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:12px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;border:none;transition:all .12s;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:#0047B3}
.btn-sec{background:var(--s);color:var(--t2);border:1px solid var(--bd2)}.btn-sec:hover{background:var(--s2)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-red{background:var(--rl);color:var(--red);border:1px solid #FFBDAD}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcard{background:var(--s);border:1px solid var(--bd);border-radius:var(--r2);padding:15px}
.klbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.kval{font-size:22px;font-weight:600;color:var(--t)}
.kdelta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:2px 6px;border-radius:10px;margin-top:5px}
.kdelta.up{background:var(--gl);color:var(--green)}
.kdelta.dn{background:var(--rl);color:var(--red)}

/* PANELS */
.twocol{display:grid;grid-template-columns:1fr 270px;gap:12px}
.panel{background:var(--s);border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--bd)}
.pt{font-size:13px;font-weight:600;color:var(--t)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s}
tbody tr:hover{background:#F8F9FF}
tbody tr:last-child{border-bottom:none}
td{padding:9px 12px;color:var(--t2);vertical-align:middle}
td.b{color:var(--t);font-weight:500}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.bn{background:var(--pl);color:var(--purple)}
.bc{background:var(--bl);color:var(--blue)}
.br{background:var(--ol);color:var(--orange)}
.bq{background:var(--tl);color:var(--teal)}
.bs{background:var(--gl);color:var(--green)}
.bl2{background:var(--rl);color:var(--red)}

/* ACTIVITY */
.ai{display:flex;gap:9px;padding:10px 15px;border-bottom:1px solid var(--bd);align-items:flex-start}
.ai:last-child{border-bottom:none}
.ai:hover{background:var(--s2)}
.aico{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aico i{font-size:14px}
.atxt{font-size:12px;color:var(--t2);line-height:1.5}
.atxt b{color:var(--t);font-weight:500}
.atm{font-size:10px;color:var(--t3);margin-top:2px}

/* PIPELINE */
.pwrap{overflow-x:auto;padding:12px}
.pcols{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;min-width:620px}
.pch{font-size:10px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.sp{font-size:10px;font-weight:600;padding:3px 9px;border-radius:10px}
.sc{font-size:10px;color:var(--t3)}
.lc{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.lc:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(0,82,204,.1)}
.ln{font-size:12px;font-weight:500;color:var(--t);margin-bottom:2px}
.lv{font-size:12px;font-weight:600;color:var(--blue)}
.lm{font-size:10px;color:var(--t3);margin-top:3px}

/* RELANCES */
.ri{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s}
.ri:hover{background:var(--s2)}
.ri:last-child{border-bottom:none}
.ri-info{flex:1}
.ri-n{font-size:13px;font-weight:500;color:var(--t)}
.ri-d{font-size:11px;color:var(--t3);margin-top:2px}
.rtag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.rug{background:var(--rl);color:var(--red)}
.rso{background:var(--ol);color:var(--orange)}

/* TABS */
.tabs{display:flex;gap:3px;padding:9px 13px;border-bottom:1px solid var(--bd)}
.tab{padding:5px 11px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;color:var(--t3);transition:all .12s;user-select:none}
.tab:hover{background:var(--s2);color:var(--t2)}
.tab.act{background:var(--bl);color:var(--blue)}

/* PERF */
.pi{padding:11px 15px;border-bottom:1px solid var(--bd)}
.pi:last-child{border-bottom:none}
.pr{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.pn{font-size:12px;color:var(--t);display:flex;align-items:center;gap:7px;font-weight:500}
.pv{font-size:12px;font-weight:600;color:var(--blue)}
.pb{height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.ps{font-size:10px;color:var(--t3);margin-top:3px}

/* FICHE */
.fscroll{flex:1;overflow-y:auto;padding:18px 20px}
.fscroll::-webkit-scrollbar{width:4px}
.fscroll::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.fhdr{display:flex;align-items:center;gap:13px;margin-bottom:16px;padding:15px;background:var(--s);border:1px solid var(--bd);border-radius:var(--r2)}
.fav{width:44px;height:44px;border-radius:50%;background:var(--bl);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.fn{font-size:16px;font-weight:600;color:var(--t)}
.fm{font-size:12px;color:var(--t3);margin-top:2px}
.scard{background:var(--s);border:1px solid var(--bd);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--bd);background:var(--s2)}
.shead i{font-size:15px;color:var(--blue)}
.shead-t{font-size:13px;font-weight:600;color:var(--t)}
.sbody{padding:13px 15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
.flbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.finp{background:var(--s);border:1px solid var(--bd2);border-radius:var(--r);padding:7px 10px;color:var(--t);font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;width:100%}
.finp:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,82,204,.15)}
select.finp{cursor:pointer}
.tgroup{display:flex;flex-wrap:wrap;gap:5px}
.tbtn{padding:6px 11px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--s);font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .12s;user-select:none;font-family:'Inter',sans-serif}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.tbtn.on{background:var(--bl);border-color:var(--blue);color:var(--blue);font-weight:600}
.score-segs{display:flex;gap:3px;flex:1}
.sseg{height:8px;flex:1;border-radius:2px;background:var(--s2)}
.notes-ta{background:var(--s);border:1px solid var(--bd2);border-radius:var(--r);padding:9px 11px;color:var(--t);font-size:12px;width:100%;min-height:65px;resize:vertical;outline:none;font-family:'Inter',sans-serif;line-height:1.5}
.notes-ta:focus{border-color:var(--blue)}
.factions{display:flex;gap:8px;margin-top:14px;padding:13px 15px;background:var(--s);border:1px solid var(--bd);border-radius:var(--r2);flex-wrap:wrap}

/* DOCS */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcard{border:1px solid var(--bd);border-radius:var(--r2);padding:13px;display:flex;flex-direction:column;gap:9px;transition:all .15s}
.dcard.has{border-color:#B3D4FF;background:#F0F7FF}
.dtop{display:flex;align-items:flex-start;gap:9px}
.dic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dic i{font-size:19px}
.dlbl{font-size:12px;font-weight:600;color:var(--t);line-height:1.3}
.dfn{font-size:11px;color:var(--blue);margin-top:2px;word-break:break-all}
.dst{font-size:11px;color:var(--t3);margin-top:2px}
.dst.ok{color:var(--green);font-weight:500}
.dbtns{display:flex;gap:5px;flex-wrap:wrap}
.dbtn{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:var(--r);font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd2);background:var(--s);color:var(--t2);transition:all .12s;font-family:'Inter',sans-serif}
.dbtn:hover{background:var(--s2)}
.dbtn.pr{background:var(--blue);color:#fff;border-color:var(--blue)}
.dbtn.pr:hover{background:#0047B3}
.dbtn.dl{color:var(--red);border-color:#FFBDAD}
.dbtn.dl:hover{background:var(--rl)}
.dpbar{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--s2);border-radius:var(--r);margin-top:4px}
.dpbar-b{flex:1;height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.dpbar-f{height:100%;border-radius:2px;transition:width .3s}

/* ELIG */
.elig-block{padding:13px 15px;border-bottom:1px solid var(--bd)}
.elig-block:last-child{border-bottom:none}
.elig-title{font-size:13px;font-weight:600;color:var(--t)}
.elig-sub{font-size:11px;color:var(--t3);margin-top:2px}
.elig-ok{font-size:12px;color:var(--green);margin-top:5px;display:flex;gap:6px;align-items:flex-start}
.elig-ko{font-size:12px;color:var(--red);margin-top:5px;display:flex;gap:6px;align-items:flex-start}
.gcheck{display:flex;align-items:center;gap:9px;cursor:pointer;padding:7px 9px;border-radius:var(--r);border:1px solid var(--bd);background:var(--s);transition:all .12s;margin-bottom:6px}
.gcheck.on{background:var(--bl);border-color:var(--blue)}
.gcheck input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.gcheck span{font-size:12px;color:var(--t2)}
.gcheck.on span{color:var(--blue);font-weight:500}

/* USERS */
.urow{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--bd);transition:background .1s}
.urow:last-child{border-bottom:none}
.urow:hover{background:var(--s2)}
.uinfo{flex:1}
.un{font-size:13px;font-weight:500;color:var(--t)}
.usub{font-size:11px;color:var(--t3);margin-top:2px}
.ucode{font-size:12px;color:var(--t3);font-family:monospace;background:var(--s2);padding:2px 8px;border-radius:4px;border:1px solid var(--bd)}
.inv-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bd2);background:var(--s);color:var(--blue);transition:all .12s;text-decoration:none}
.inv-btn:hover{background:var(--bl);border-color:var(--blue)}

/* NOTIF */
.nbell{position:fixed;bottom:18px;right:18px;z-index:250;width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,82,204,.4);font-size:21px;transition:transform .15s}
.nbell:hover{transform:scale(1.08)}
.nbadge2{position:absolute;top:-2px;right:-2px;background:#DE350B;color:#fff;font-size:9px;font-weight:700;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.npanel{position:fixed;bottom:78px;right:18px;z-index:250;width:310px;background:var(--s);border:1px solid var(--bd);border-radius:var(--r2);box-shadow:0 8px 32px rgba(0,0,0,.15);overflow:hidden}
.nph{padding:11px 13px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.nph-close{cursor:pointer;font-size:15px;opacity:.8}
.nitem{display:flex;gap:9px;padding:9px 13px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .1s}
.nitem:hover{background:var(--s2)}
.nitem:last-child{border-bottom:none}
.nitem-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.nitem-t{font-size:12px;font-weight:600;color:var(--t)}
.nitem-s{font-size:11px;color:var(--t3);margin-top:2px}
.nbanner{position:fixed;top:0;left:0;right:0;z-index:300;background:#DE350B;color:#fff;padding:11px 15px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.nbanner-t{flex:1;font-size:13px;font-weight:500}
.nbanner-x{cursor:pointer;font-size:17px;opacity:.8}

/* MOBILE */
.mob-nav{display:none;overflow-x:auto;padding:7px;gap:3px;border-top:1px solid var(--bd);background:var(--s)}
.mni{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 11px;border-radius:var(--r);cursor:pointer;font-size:10px;color:var(--t3);transition:all .12s;white-space:nowrap;flex-shrink:0;min-width:56px;user-select:none}
.mni:hover,.mni.act{background:var(--bl);color:var(--blue)}
.mni i{font-size:19px}
.mnb{background:#DE350B;color:#fff;font-size:9px;padding:1px 4px;border-radius:8px;min-width:15px;text-align:center}
@media(max-width:768px){
  .sb .nav,.sb .team-s{display:none}
  .sb{width:100%;min-width:unset;height:auto;border-right:none;border-bottom:1px solid var(--bd)}
  .mob-nav{display:flex!important}
  .app{flex-direction:column}
  .main{height:calc(100vh - 110px)}
  .kgrid{grid-template-columns:1fr 1fr}
  .twocol{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .topbar{padding:9px 13px}
  .content{padding:12px}
  .fscroll{padding:12px}
  .npanel{right:10px;left:10px;width:auto;bottom:65px}
  .nbell{bottom:12px;right:12px}
}
@media(min-width:769px){.mob-nav{display:none!important}}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(9,30,66,.5);z-index:200;align-items:center;justify-content:center}
.moverlay.open{display:flex}
.mbox{background:var(--s);border-radius:var(--r2);width:480px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 8px 32px rgba(9,30,66,.25)}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--bd)}

const db = firebase.firestore();
const COLLECTION = 'contacts';

// Sync en temps réel
let unsubscribe = null;

function startSync() {
  if (unsubscribe) unsubscribe();
  unsubscribe = db.collection(COLLECTION).onSnapshot(snapshot => {
    if (snapshot.empty && state.contacts.length > 0) {
      // Première fois : upload les contacts par défaut
      uploadDefaultContacts();
      return;
    }
    const contacts = [];
    snapshot.forEach(doc => contacts.push({...doc.data(), _docId: doc.id}));
    // Trie par id décroissant (plus récent en premier)
    contacts.sort((a,b) => b.id - a.id);
    state.contacts = contacts;
    render();
  }, err => console.error('Firestore error:', err));
}

function uploadDefaultContacts() {
  const batch = db.batch();
  DEFAULT.forEach(c => {
    const ref = db.collection(COLLECTION).doc(String(c.id));
    batch.set(ref, c);
  });
  batch.commit().catch(e => console.error('Upload error:', e));
}

async function save() {
  // Sauvegarde aussi en localStorage comme backup
  try { localStorage.setItem(SK, JSON.stringify({contacts: state.contacts})); } catch(e) {}
}

async function saveContact(c) {
  try {
    const docId = c._docId || String(c.id);
    const data = {...c};
    delete data._docId;
    await db.collection(COLLECTION).doc(docId).set(data);
  } catch(e) {
    console.error('Save error:', e);
    // Fallback localStorage
    try { localStorage.setItem(SK, JSON.stringify({contacts: state.contacts})); } catch(e2) {}
  }
}

async function deleteContact(id) {
  try {
    const c = state.contacts.find(x => x.id === id);
    const docId = c?._docId || String(id);
    await db.collection(COLLECTION).doc(docId).delete();
  } catch(e) { console.error('Delete error:', e); }
}

}

// FILE UPLOAD
// ═══════════════════════════════════════════
function trigUp(cid,k){ document.getElementById(`fu-${cid}-${k}`).click(); }
function handleFile(cid,k,inp){
  const f=inp.files[0]; if(!f)return;
  const sz=f.size>1048576?(f.size/1048576).toFixed(1)+' Mo':(f.size/1024).toFixed(0)+' Ko';
  const r=new FileReader();
  r.onload=e=>updDoc(cid,k,{name:f.name,size:sz,data:e.target.result});
  r.readAsDataURL(f);
}
function removeDoc(cid,k){ if(confirm('Supprimer ce document ?'))updDoc(cid,k,null); }
function viewDoc(cid,k){
  const c=state.contacts.find(x=>x.id===cid);
  const d=c&&c.docs&&c.docs[k];
  if(!d)return;
  if(d.data){ const w=window.open(); w.document.write(`<img src="${d.data}" style="max-width:100%"><br><a href="${d.data}" download="${d.name}">Télécharger</a>`); }
  else alert(d.name);
}

// NOTIFICATIONS
// ═══════════════════════════════════════════
let notifOpen=false;
function getUrgent(){ return visibleContacts().filter(c=>c.urgence==='urgent'); }
function sendBrowserNotif(title,body,cid){
  if('Notification'in window&&Notification.permission==='granted'){
    const n=new Notification(title,{body,requireInteraction:true});
    n.onclick=()=>{ window.focus(); openFiche(cid); n.close(); };
  }
}
function showBanner(urgent){
  const ex=document.getElementById('nbanner'); if(ex)ex.remove();
  if(!urgent.length)return;
  const b=document.createElement('div');
  b.id='nbanner'; b.className='nbanner';
  b.innerHTML=`<i class="ti ti-bell-ringing" style="font-size:19px;flex-shrink:0"></i><div class="nbanner-t"><b>${urgent.length} relance${urgent.length>1?'s':''} urgente${urgent.length>1?'s':''}</b> — ${urgent.map(c=>c.prenom+' '+c.nom).join(', ')}</div><span class="nbanner-x" onclick="this.parentElement.remove()">✕</span>`;
  document.body.prepend(b);
  setTimeout(()=>{ if(b.parentElement)b.remove(); },8000);
}
function toggleNotif(){
  notifOpen=!notifOpen;
  const ex=document.getElementById('npanel'); if(ex)ex.remove();
  if(!notifOpen)return;
  const urgent=getUrgent();
  const soon=visibleContacts().filter(c=>c.urgence==='soon');
  const all=[...urgent,...soon];
  const p=document.createElement('div');
  p.id='npanel'; p.className='npanel';
  p.innerHTML=`<div class="nph"><span><i class="ti ti-bell" style="margin-right:5px"></i>Relances (${all.length})</span><span class="nph-close" onclick="toggleNotif()">✕</span></div>
    ${all.length?all.map(c=>`<div class="nitem" onclick="toggleNotif();openFiche(${c.id})"><div class="nitem-ic" style="background:${c.urgence==='urgent'?'#FFEBE6':'#FFF0E6'}"><i class="ti ti-phone" style="color:${c.urgence==='urgent'?'#BF2600':'#974F0C'}"></i></div><div><div class="nitem-t">${c.prenom} ${c.nom} <span style="font-weight:400;color:var(--t3)">→ ${c.commercial}</span></div><div class="nitem-s">${c.offre} · <b style="color:${c.urgence==='urgent'?'#BF2600':'#974F0C'}">${c.urgence==='urgent'?"Aujourd'hui":'Cette semaine'}</b></div></div></div>`).join(''):'<div class="empty">Aucune relance 🎉</div>'}
    <div style="padding:9px 13px;border-top:1px solid var(--bd)"><button class="btn btn-p" style="width:100%;justify-content:center" onclick="toggleNotif();fireNotifs()"><i class="ti ti-bell-ringing"></i> Envoyer toutes les relances</button></div>`;
  document.body.appendChild(p);
}
function fireNotifs(){
  const urgent=getUrgent();
  showBanner(urgent);
  if('Notification'in window&&Notification.permission==='default') Notification.requestPermission();
  urgent.forEach((c,i)=>setTimeout(()=>sendBrowserNotif('📞 Relance — '+c.commercial,c.prenom+' '+c.nom+' · '+c.offre,c.id),i*2000));
}
function renderBell(){
  const ex=document.getElementById('nbell-wrap'); if(ex)ex.remove();
  const urgent=getUrgent();
  const w=document.createElement('div'); w.id='nbell-wrap';
  w.innerHTML=`<div class="nbell" onclick="toggleNotif()"><i class="ti ti-bell"></i>${urgent.length?`<div class="nbadge2">${urgent.length}</div>`:''}</div>`;
  document.body.appendChild(w);
}

// ═══════════════════════════════════════════
// SYSTÈME DE RAPPELS TÉLÉPHONIQUES
// ═══════════════════════════════════════════
let rappelQueue = [];      // file d'attente des rappels à afficher
let rappelActive = null;   // rappel en cours d'affichage
let rappelTimer = null;    // intervalle de vérification

function startRappelSystem(){
  // Démarre la sync Firebase
  startSync();
  if(rappelTimer) clearInterval(rappelTimer);
  rappelTimer = setInterval(checkRappels, 30000); // vérifie toutes les 30s
  checkRappels(); // vérification immédiate
}

function checkRappels(){
  if(!currentUser) return;
  const now = new Date();
  const contacts = visibleContacts();
  contacts.forEach(c => {
    if(!c.rappel) return;
    const rappelDate = new Date(c.rappel);
    const diff = now - rappelDate;
    // Déclenche si l'heure est passée (dans les 30 dernières minutes)
    if(diff >= 0 && diff < 1800000 && !c.rappelFait){
      // Vérifie qu'il n'est pas déjà dans la queue ou affiché
      if(!rappelQueue.find(r=>r.id===c.id) && (!rappelActive||rappelActive.id!==c.id)){
        rappelQueue.push({...c});
        // Notif navigateur
        if('Notification'in window && Notification.permission==='granted'){
          const n = new Notification('📞 Rappel — '+c.prenom+' '+c.nom, {
            body: c.tel+' · '+c.offre+' · '+c.commercial,
            requireInteraction: true,
            tag: 'rappel-'+c.id
          });
          n.onclick = ()=>{ window.focus(); showNextRappel(); n.close(); };
        }
      }
    }
  });
  if(!rappelActive && rappelQueue.length > 0) showNextRappel();
}

function showNextRappel(){
  if(rappelQueue.length === 0){ rappelActive = null; return; }
  rappelActive = rappelQueue.shift();
  showRappelPopup(rappelActive);
}

function showRappelPopup(c){
  // Supprime l'ancien popup s'il existe
  const ex = document.getElementById('rappel-overlay'); if(ex) ex.remove();
  
  const rappelDate = c.rappel ? new Date(c.rappel) : null;
  const dateStr = rappelDate ? rappelDate.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) : '';
  const heureStr = rappelDate ? rappelDate.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';

  const overlay = document.createElement('div');
  overlay.id = 'rappel-overlay';
  overlay.className = 'rappel-overlay';
  overlay.innerHTML = `
    <div class="rappel-card">
      <div class="rappel-top">
        <div class="rappel-badge">📞 Rappel téléphonique · ${heureStr}</div>
        <div class="rappel-name">${c.prenom} ${c.nom}</div>
        <div class="rappel-info">${c.offre} · ${c.ville} · Assigné à ${c.commercial}</div>
        ${c.tel ? `<a class="rappel-tel" href="tel:${c.tel.replace(/\s/g,'')}">
          <i class="ti ti-phone" style="font-size:20px"></i>
          <span class="rappel-tel-num">${c.tel}</span>
          <span style="font-size:11px;opacity:.8;margin-left:auto">Appeler ↗</span>
        </a>` : ''}
      </div>
      <div class="rappel-body">
        <div class="rappel-note">
          <b>Statut :</b> ${c.statut} &nbsp;·&nbsp; <b>RFR :</b> ${c.rfr?c.rfr.toLocaleString('fr-FR')+' €':'—'} &nbsp;·&nbsp; <b>DPE :</b> ${c.dpe||'—'}<br>
          ${c.notes?`<span style="color:#97A0AF">Note : ${c.notes.substring(0,80)}${c.notes.length>80?'…':''}</span>`:'<span style="color:#97A0AF">Aucune note</span>'}
        </div>
        <div class="rappel-actions">
          <button class="rappel-btn-main rappel-btn-done" onclick="marquerRappele(${c.id})">
            <i class="ti ti-phone-check"></i> Rappelé ✓
          </button>
          <div class="rappel-btn-row">
            <button class="rappel-btn-sm rappel-btn-report" onclick="showReporter(${c.id})">
              <i class="ti ti-clock"></i> Reporter
            </button>
            <button class="rappel-btn-sm rappel-btn-fiche" onclick="document.getElementById('rappel-overlay').remove();rappelActive=null;openFiche(${c.id})">
              <i class="ti ti-user"></i> Voir fiche
            </button>
          </div>
          ${rappelQueue.length>0?`<div class="rappel-counter">+${rappelQueue.length} autre(s) rappel(s) en attente</div>`:''}
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  // Demande permission notif si pas encore fait
  if('Notification'in window && Notification.permission==='default') Notification.requestPermission();
}

function marquerRappele(id){
  state.contacts = state.contacts.map(c => c.id===id ? {...c, rappelFait:true, rappel:null, statut: c.statut==='Nouveau'?'Contacté':c.statut} : c);
  save();
  const cu=state.contacts.find(x=>x.id===id);
  if(cu) saveContact(cu);
  const overlay = document.getElementById('rappel-overlay'); if(overlay) overlay.remove();
  rappelActive = null;
  render();
  setTimeout(showNextRappel, 500);
}

function showReporter(id){
  const overlay = document.getElementById('rappel-overlay');
  if(overlay) overlay.style.display='none';
  
  const now = new Date();
  const plus1h = new Date(now.getTime()+3600000);
  const plus2h = new Date(now.getTime()+7200000);
  const demain = new Date(now); demain.setDate(demain.getDate()+1); demain.setHours(9,0,0,0);
  const fmt2 = d => d.toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const toISO = d => d.toISOString().slice(0,16);

  const box = document.createElement('div');
  box.className = 'rappel-overlay';
  box.id = 'reporter-overlay';
  box.innerHTML = `
    <div class="reporter-card">
      <div class="reporter-head">
        <span><i class="ti ti-clock" style="margin-right:6px;color:var(--orange)"></i>Reporter le rappel</span>
        <span style="cursor:pointer;color:var(--t3);font-size:16px" onclick="closeReporter(${id})">✕</span>
      </div>
      <div class="reporter-body">
        <div class="reporter-opt" onclick="programmerRappel(${id},'${toISO(plus1h)}');closeReporter(0)">
          <i class="ti ti-clock-hour-3"></i><span>Dans 1 heure — <b>${fmt2(plus1h)}</b></span>
        </div>
        <div class="reporter-opt" onclick="programmerRappel(${id},'${toISO(plus2h)}');closeReporter(0)">
          <i class="ti ti-clock-hour-6"></i><span>Dans 2 heures — <b>${fmt2(plus2h)}</b></span>
        </div>
        <div class="reporter-opt" onclick="programmerRappel(${id},'${toISO(demain)}');closeReporter(0)">
          <i class="ti ti-calendar-plus"></i><span>Demain matin — <b>${fmt2(demain)}</b></span>
        </div>
        <div class="reporter-custom">
          <label>Date et heure personnalisée</label>
          <input type="datetime-local" id="custom-rappel-date" min="${toISO(now)}">
          <button class="btn btn-p btn-sm" style="margin-top:6px;width:100%;justify-content:center" onclick="const v=document.getElementById('custom-rappel-date').value;if(v){programmerRappel(${id},v);closeReporter(0);}else{alert('Choisissez une date');}">
            Confirmer
          </button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(box);
}

function closeReporter(id){
  const r = document.getElementById('reporter-overlay'); if(r) r.remove();
  const o = document.getElementById('rappel-overlay');
  if(o){ o.remove(); rappelActive=null; }
  setTimeout(showNextRappel, 300);
}

function programmerRappel(id, dateStr){
  state.contacts = state.contacts.map(c => c.id===id ? {...c, rappel:dateStr, rappelFait:false} : c);
  save();
  const c=state.contacts.find(x=>x.id===id);
  if(c) saveContact(c);
  render();
  // Feedback visuel
  const msg = document.createElement('div');
  msg.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#006644;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:600;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  msg.innerHTML='<i class="ti ti-check" style="margin-right:6px"></i>Rappel programmé !';
  document.body.appendChild(msg);
  setTimeout(()=>msg.remove(), 2500);
}

function supprimerRappel(id){
  state.contacts = state.contacts.map(c => c.id===id ? {...c, rappel:null, rappelFait:false} : c);
  save(); render();
}

// Start
document.getElementById('login-inp').focus();
</script>
</body>
</html>
